<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>爝火不熄</title>
  <style>
    @font-face{font-family:Huiwen;src:url("assets/fonts/huiwen-mincho.woff") format("woff");font-display:swap}
    :root{--ink:#050505;--paper:#f2efe7;--blue:#163dcc;--red:#73151b;--line:rgba(242,239,231,.34)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Huiwen,"Songti SC",serif}
    button{font:inherit}.hidden{display:none!important}.app{position:relative;width:100%;height:100dvh;background:#050505}
    .orientation{display:none;position:fixed;z-index:999;inset:0;place-content:center;text-align:center;background:#050505;padding:32px}.orientation b{font-size:34px}.orientation p{color:#aaa}.orientation button{justify-self:center;border:1px solid #aaa;background:#f2efe7;padding:10px 18px;color:#050505;font:16px Huiwen,"Songti SC",serif}
    .landing{position:absolute;inset:0;overflow:hidden}.landing-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(.65)}
    .landing:after{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.02) 52%,rgba(0,0,0,.88));content:""}
    .title{position:absolute;z-index:2;top:8%;left:6%}.title small{font:10px ui-monospace,monospace;letter-spacing:.24em;color:#aaa}.title h1{margin:10px 0 0;font-size:clamp(50px,8vw,120px);font-weight:400;letter-spacing:.08em;text-shadow:0 2px 18px #000}
    .routes{position:absolute;z-index:3;top:17%;right:5%;display:grid;width:min(34vw,470px);gap:1px}.routes>span{margin-bottom:12px;font:10px ui-monospace,monospace;letter-spacing:.22em;color:#aaa}
    .route{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:13px;border:0;border-bottom:1px solid rgba(255,255,255,.36);background:rgba(0,0,0,.42);padding:15px 9px;color:#fff;text-align:left;cursor:pointer;transition:.25s}.route:hover{background:var(--paper);color:#050505;padding-left:18px}.route>span,.route>b{font:10px ui-monospace,monospace;color:#5274ff}.route strong{display:block;font-size:clamp(18px,2vw,29px);font-weight:400}.route small{display:block;margin-bottom:3px;font:9px ui-monospace,monospace;color:#999}
    .toolbar{position:absolute;z-index:40;top:0;left:0;right:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;height:58px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.91);padding:8px 18px}.game-name small{display:block;font:8px ui-monospace,monospace;color:#888}.game-name strong{font-size:18px;font-weight:400}.progress{height:2px;background:#333}.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .45s}.tools{display:flex;gap:6px}.tools button,.music button{border:1px solid #777;background:#0a0a0a;padding:7px 10px;color:#eee;cursor:pointer}
    .board{position:absolute;inset:58px 0 0;overflow:hidden}.portrait{position:absolute;z-index:1;top:50%;right:4%;height:min(76vh,720px);aspect-ratio:3/4;transform:translateY(-50%);border:1px solid #777;background:#111;box-shadow:12px 12px 0 rgba(255,255,255,.05)}.portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.2) brightness(.9)}
    .gallery{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.83);border:1px solid #aaa;padding:3px}.gallery button{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer}.gallery span{font:9px ui-monospace,monospace}
    .reader{position:absolute;z-index:4;inset:0 37% 0 0;background:linear-gradient(90deg,#050505 0 92%,rgba(5,5,5,.88) 96%,transparent);padding:clamp(32px,6vh,74px) clamp(32px,5vw,90px);display:flex;flex-direction:column}.chapter{font:9px ui-monospace,monospace;letter-spacing:.2em;color:#777}.heading{margin:12px 0 20px}.heading small{font:10px ui-monospace,monospace;color:#888}.heading h2{margin:5px 0 0;font-size:clamp(29px,4vw,56px);font-weight:400}.scroll{overflow-y:auto;padding-right:12px;scrollbar-width:thin;line-height:1.8}.copy{font-size:clamp(17px,1.5vw,23px);letter-spacing:.04em}.copy p{margin:0 0 .8em}.decision{margin-top:24px;padding-bottom:30px}.decision h3{font-size:14px;font-weight:400;color:#999;letter-spacing:.15em}.prompt{font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px}.choice{display:grid;grid-template-columns:25px 1fr;gap:8px;align-items:center;border:0;border-bottom:1px solid #777;background:transparent;padding:11px 4px;color:#eee;text-align:left;cursor:pointer}.choice:hover{background:var(--paper);color:#050505}.choice span{font:10px ui-monospace,monospace;color:#5274ff}.choice b{font-weight:400;font-size:16px;line-height:1.45}.reveal-btn{border:0;background:var(--paper);padding:13px 22px;color:#050505;cursor:pointer}
    .ending{position:absolute;inset:58px 0 0;background:#050505;overflow:hidden}.ending>img{position:absolute;inset:0;width:58%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.3) brightness(.42)}.ending:after{position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,#050505 58%);content:""}.credits{position:absolute;z-index:3;left:4%;bottom:8%;width:27%;font:10px ui-monospace,monospace;color:#888;line-height:1.55}.credits>span{display:block;margin-bottom:14px;color:#eee;letter-spacing:.25em}.credits p{margin:9px 0 1px;color:#ddd;font-size:12px}.credits i{display:block;width:32px;height:1px;margin:15px 0;background:var(--red)}
    .ending-paper{position:absolute;z-index:4;top:0;right:0;width:48%;height:100%;overflow-y:auto;padding:6% 7% 5% 4%;background:rgba(5,5,5,.92)}.ending-paper>span{font:9px ui-monospace,monospace;color:#5274ff;letter-spacing:.18em}.ending-paper>p{margin-top:28px;color:#aaa}.ending-paper h2{margin:4px 0 10px;font-size:clamp(40px,6vw,84px);font-weight:400}.stamp{display:inline-block;border:1px solid var(--red);padding:5px 10px;color:#ddd}.ending-paper h3{font-size:clamp(18px,2vw,28px);font-weight:400;line-height:1.45}.verdict{font-size:16px;line-height:1.75;color:#ccc}.ending-actions{display:flex;gap:8px;margin-top:22px}.ending-actions button{border:1px solid #aaa;background:transparent;padding:10px 15px;color:#fff;cursor:pointer}.ending-actions button:first-child{background:var(--paper);color:#050505}
    .music{position:fixed;z-index:100;right:14px;bottom:12px;display:flex;align-items:center;gap:6px;border:1px solid #777;background:rgba(0,0,0,.9);padding:4px}.music span{min-width:66px;font-size:11px}.music small{display:block;font:7px ui-monospace,monospace;color:#888}.music input{width:65px;accent-color:var(--red)}.notice{position:fixed;z-index:120;left:50%;bottom:18px;transform:translateX(-50%);background:#eee;color:#050505;padding:8px 15px;font-size:13px}
    /* Compact landscape layout for phones. Desktop rules above remain untouched. */
    @media(max-height:620px) and (orientation:landscape){
      .title{top:5%;left:4%}.title small{font-size:7px}.title h1{margin-top:4px;font-size:clamp(38px,8vw,68px)}
      .routes{top:6%;right:3%;width:min(39vw,390px);gap:0}.routes>span{margin-bottom:3px;font-size:7px}
      .route{grid-template-columns:25px 1fr auto;gap:7px;padding:7px 6px;min-height:0}.route:hover{padding-left:9px}.route>span,.route>b{font-size:7px}.route strong{font-size:clamp(15px,2.2vw,20px);line-height:1.1}.route small{font-size:7px;margin-bottom:1px}
      .toolbar{height:40px;gap:10px;padding:4px 8px}.game-name small{font-size:6px}.game-name strong{font-size:13px}.progress{height:1px}.tools{gap:3px}.tools button{padding:4px 6px;font-size:11px}
      .board,.ending{inset:40px 0 0}.portrait{right:2%;height:calc(100% - 14px);max-height:none;box-shadow:5px 5px 0 rgba(255,255,255,.05)}
      .reader{inset:0 41% 0 0;padding:14px 22px 12px 20px;background:linear-gradient(90deg,#050505 0 93%,rgba(5,5,5,.9) 97%,transparent)}
      .chapter{font-size:7px}.heading{margin:4px 0 7px}.heading small{font-size:7px}.heading h2{margin-top:2px;font-size:25px}.scroll{padding-right:7px;line-height:1.65}.copy{font-size:14px}.copy p{margin-bottom:.55em}.decision{margin-top:12px;padding-bottom:18px}.decision h3{margin:4px 0;font-size:10px}.prompt{margin:6px 0;font-size:12px}.choices{gap:3px 12px}.choice{grid-template-columns:17px 1fr;gap:4px;padding:5px 2px}.choice span{font-size:7px}.choice b{font-size:11px;line-height:1.25}
      .music{right:6px;bottom:5px;gap:3px;padding:2px;background:rgba(0,0,0,.78)}.music button{padding:3px 5px;font-size:9px}.music span{display:none}.music input{width:42px;height:12px}
      .gallery{right:4px;bottom:4px;padding:1px}.gallery button{font-size:14px}.gallery span{font-size:7px}
      .credits{left:2%;bottom:3%;width:31%;font-size:7px;line-height:1.25}.credits>span{margin-bottom:5px}.credits p{margin:3px 0 0;font-size:8px}.credits i{margin:6px 0}.ending-paper{padding:3% 4% 3% 3%}.ending-paper>p{margin-top:10px}.ending-paper h2{font-size:38px}.ending-paper h3{font-size:16px}.verdict{font-size:11px;line-height:1.5}.ending-actions{margin-top:8px}.ending-actions button{padding:5px 8px;font-size:10px}
    }
    /* Phone portrait: show the landscape canvas rotated immediately. The user naturally turns the device; landscape then becomes upright. */
    @media(orientation:portrait) and (max-width:900px){
      html,body{width:100%;height:100%;overflow:hidden}
      .app{
        position:fixed;
        top:0;
        left:0;
        width:100dvh;
        height:100vw;
        min-height:0;
        overflow:hidden;
        transform:rotate(90deg) translateY(-100%);
        transform-origin:top left;
      }
      .orientation{display:none!important}
      .landing,.board,.ending{width:100%;height:100%}
      .title{top:5%;left:4%}.title small{font-size:7px}.title h1{margin-top:4px;font-size:clamp(38px,13vw,68px)}
      .routes{top:6%;right:3%;width:39%;gap:0}.routes>span{margin-bottom:3px;font-size:7px}
      .route{grid-template-columns:25px 1fr auto;gap:7px;padding:7px 6px;min-height:0}.route>span,.route>b{font-size:7px}.route strong{font-size:clamp(15px,4.4vw,20px);line-height:1.1}.route small{font-size:7px;margin-bottom:1px}
      .toolbar{height:40px;gap:10px;padding:4px 8px}.game-name small{font-size:6px}.game-name strong{font-size:13px}.progress{height:1px}.tools{gap:3px}.tools button{padding:4px 6px;font-size:11px}
      .board,.ending{inset:40px 0 0}.portrait{right:2%;height:calc(100% - 14px);max-height:none;box-shadow:5px 5px 0 rgba(255,255,255,.05)}
      .reader{inset:0 41% 0 0;padding:14px 22px 12px 20px}.chapter{font-size:7px}.heading{margin:4px 0 7px}.heading small{font-size:7px}.heading h2{margin-top:2px;font-size:25px}.scroll{padding-right:7px;line-height:1.65}.copy{font-size:14px}.copy p{margin-bottom:.55em}.decision{margin-top:12px;padding-bottom:18px}.decision h3{margin:4px 0;font-size:10px}.prompt{margin:6px 0;font-size:12px}.choices{gap:3px 12px}.choice{grid-template-columns:17px 1fr;gap:4px;padding:5px 2px}.choice span{font-size:7px}.choice b{font-size:11px;line-height:1.25}
      .music{right:6px;bottom:5px;gap:3px;padding:2px;background:rgba(0,0,0,.78)}.music button{padding:3px 5px;font-size:9px}.music span{display:none}.music input{width:42px;height:12px}
    }
  </style>
</head>
<body>
  <main id="app" class="app"><div style="display:grid;place-content:center;height:100%;color:#888">正在装订故事……</div></main>
  <audio id="bgm" loop preload="metadata"></audio>
  <script>
  (()=>{
    const app=document.querySelector('#app'),audio=document.querySelector('#bgm');
    const state={data:null,phase:'landing',eraIndex:0,commonIndex:0,branchIndex:null,nodeIndex:0,runId:'',playing:false,volume:.42,imageIndex:0};
    const tracks={common:'assets/audio/common.mp3',character:'assets/audio/character.mp3',ending:'assets/audio/ending.mp3'};
    const trackLabels={common:['共通线','未名之路'],character:['人物节点','命运逼近'],ending:['结局','姓名显影']};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const rid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);
    function era(){return state.data.eras[state.eraIndex]} function branch(){return state.branchIndex===null?null:era().branches[state.branchIndex]}
    function scene(){if(state.phase==='common')return era().common[state.commonIndex];if(state.phase==='branch')return branch().nodes[state.nodeIndex];if(state.phase==='moment')return branch().finalMoment;return null}
    function stage(){return state.phase==='landing'||state.phase==='common'?'common':state.phase==='branch'?'character':'ending'}
    function gallery(id){if(id==='founding-common-4')return [1,2,3].map(n=>`assets/media/${id}-${n}.webp`);if(id.endsWith('common-5'))return [`assets/media/${id}.webp`,`assets/media/${era().id}-common-ending.webp`];return [`assets/media/${id}.webp`]}
    function syncMusic(){const s=stage(),src=tracks[s];if(!audio.src.endsWith(src)){audio.src=src;if(state.playing)audio.play().catch(()=>state.playing=false)}audio.volume=state.volume;const l=trackLabels[s];document.querySelector('.music span')?.replaceChildren(Object.assign(document.createElement('b'),{textContent:l[0]}),Object.assign(document.createElement('small'),{textContent:l[1]}))}
    function shell(content,progress=0){return `<header class="toolbar"><div class="game-name"><small>${esc(era().period)}</small><strong>${esc(era().title)}</strong></div><div class="progress"><i style="width:${progress}%"></i></div><nav class="tools"><button data-act="save">存档</button><button data-act="load">读档</button><button data-act="home">时代</button><button data-act="restart">重走</button></nav></header>${content}${musicUI()}`}
    function musicUI(){const l=trackLabels[stage()];return `<div class="music"><button data-act="music">${state.playing?'暂停':'播放'} BGM</button><span><b>${l[0]}</b><small>${l[1]}</small></span><input data-act="volume" aria-label="音量" type="range" min="0" max="1" step=".05" value="${state.volume}"></div>`}
    function landing(){app.innerHTML=`<section class="landing"><img class="landing-bg" src="assets/art/start-ui.png" alt="三条时代道路"><header class="title"><small>FIRST-PERSON HISTORICAL NOVEL</small><h1>爝火不熄</h1></header><nav class="routes"><span>ROUTE SELECTION</span>${state.data.eras.map((e,i)=>`<button class="route" data-era="${i}"><span>0${i+1}</span><div><small>${esc(e.period)}</small><strong>${esc(e.title)}</strong></div><b>ENTER</b></button>`).join('')}</nav></section>${musicUI()}`;bind();syncMusic()}
    function reader(){const s=scene(),g=gallery(s.id);state.imageIndex=Math.min(state.imageIndex,g.length-1);const p=state.phase==='common'?8+state.commonIndex*11:state.phase==='branch'?62+state.nodeIndex*11:94;app.innerHTML=shell(`<article class="board"><aside class="portrait"><img src="${g[state.imageIndex]}" alt="${esc(s.title)}">${g.length>1?`<div class="gallery"><button data-act="previmg">‹</button><span>${state.imageIndex+1} / ${g.length}</span><button data-act="nextimg">›</button></div>`:''}</aside><section class="reader"><span class="chapter">${state.phase==='common'?'COMMON MEMORY':state.phase==='branch'?'UNKNOWN LIFE':'FINAL MOMENT'}</span><header class="heading"><small>${esc(s.meta)}</small><h2>${esc(s.title)}</h2></header><div class="scroll"><div class="copy">${s.body.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="decision"><h3>此刻，你决定——</h3>${s.prompt?`<p class="prompt">${esc(s.prompt)}</p>`:''}${s.choices.length?`<div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span>${esc(c.id)}</span><b>${esc(c.text)}</b></button>`).join('')}</div>`:`<button class="reveal-btn" data-act="reveal">揭开最后一页 →</button>`}</div></div></section></article>`,p);bind();syncMusic()}
    function ending(){const b=branch(),e=era();app.innerHTML=shell(`<article class="ending"><img src="assets/art/${e.id}.webp" alt="时代场景"><aside class="credits"><span>Audio Credits</span><p>“Xian Chou” by Richard Guo</p><small>from Chinese Style BGM</small><p>Music assets by alkakrab</p><small>from fantasy-rpg-soundtrack-music</small><i></i><em>Special thanks to all composers for generously providing free music resources.</em></aside><section class="ending-paper"><span>你的身份终于显影</span><p>在这个世界里，你是</p><h2>${esc(b.secretName)}</h2><span class="stamp">“${esc(b.pathLabel)}”</span><h3>${esc(b.ending)}</h3><div class="verdict">${b.verdict.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="ending-actions"><button data-act="home">选择另一个时代</button><button data-act="restart">重走这段人生</button></div></section></article>`,100);bind();syncMusic();recordEnding()}
    function start(i){Object.assign(state,{phase:'common',eraIndex:i,commonIndex:0,branchIndex:null,nodeIndex:0,runId:rid(),imageIndex:0,playing:true});reader();audio.play().catch(()=>{state.playing=false;reader()})}
    function choose(i){state.imageIndex=0;if(state.phase==='common'){if(state.commonIndex<era().common.length-1)state.commonIndex++;else{state.branchIndex=Math.min(i,era().branches.length-1);state.nodeIndex=0;state.phase='branch'}}else if(state.phase==='branch'){if(state.nodeIndex<2)state.nodeIndex++;else state.phase='moment'}reader()}
    function save(){localStorage.setItem('juehuo-github-save',JSON.stringify({...state,data:undefined}));toast('进度已保存')}
    function load(){try{const x=JSON.parse(localStorage.getItem('juehuo-github-save'));if(!x)return toast('还没有存档');Object.assign(state,x);state.phase==='reveal'?ending():reader();toast('进度已读取')}catch{toast('存档无法读取')}}
    function toast(t){const n=document.createElement('div');n.className='notice';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),1500)}
    async function recordEnding(){const b=branch(),cfg=window.JUEHUO_STATS;if(!cfg?.url||!cfg?.key)return;let visitor=localStorage.getItem('juehuo-visitor');if(!visitor){visitor=rid();localStorage.setItem('juehuo-visitor',visitor)}fetch(`${cfg.url}/rest/v1/ending_choices`,{method:'POST',headers:{'content-type':'application/json',apikey:cfg.key,authorization:`Bearer ${cfg.key}`,prefer:'return=minimal'},body:JSON.stringify({visitor_id:visitor,run_id:state.runId,era_id:era().id,branch_id:b.id,ending_name:b.secretName})}).catch(()=>{})}
    function bind(){app.querySelectorAll('[data-era]').forEach(x=>x.onclick=()=>start(+x.dataset.era));app.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>choose(+x.dataset.choice));app.querySelectorAll('[data-act]').forEach(x=>{const a=x.dataset.act;if(a==='save')x.onclick=save;if(a==='load')x.onclick=load;if(a==='home')x.onclick=()=>{state.phase='landing';landing()};if(a==='restart')x.onclick=()=>start(state.eraIndex);if(a==='reveal')x.onclick=()=>{state.phase='reveal';ending()};if(a==='music')x.onclick=()=>{state.playing=!state.playing;state.playing?audio.play().catch(()=>state.playing=false):audio.pause();state.phase==='landing'?landing():state.phase==='reveal'?ending():reader()};if(a==='volume')x.oninput=()=>{state.volume=+x.value;audio.volume=state.volume};if(a==='previmg')x.onclick=()=>{const g=gallery(scene().id);state.imageIndex=(state.imageIndex-1+g.length)%g.length;reader()};if(a==='nextimg')x.onclick=()=>{const g=gallery(scene().id);state.imageIndex=(state.imageIndex+1)%g.length;reader()}})}
    fetch('assets/story-data.json').then(r=>r.json()).then(d=>{state.data=d;landing()}).catch(()=>app.innerHTML='<div style="padding:40px">剧情文件加载失败。请通过网站服务器打开，不要直接双击 HTML。</div>');
  })();
  </script>
</body>
</html>
